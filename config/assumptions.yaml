attention:
  funding_floor:
    value: 0.90
    status: illustrative
    source: Brief, Parts 7.7 and 7.10
    date: 2026-11-06
    reason: Funding level the attention checks compare against.
  chance_below_floor_threshold:
    value: 0.25
    status: illustrative
    source: Modelling choice, set before any simulation results existed
    date: 2026-11-06
    reason: A portfolio is listed if its chance of falling below the funding floor is at or above this.
